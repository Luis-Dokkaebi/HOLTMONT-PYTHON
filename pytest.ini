[pytest]
# La suite vive en tests/. Declararlo explicitamente evita que `pytest` sin
# argumentos recoja la copia vendorizada HOLTMONT-PYTHON-main/ (cuyos modulos
# de prueba tienen los mismos nombres de archivo y rompen la importacion con
# "import file mismatch") ni los scripts de diagnostico manual de la raiz.
testpaths = tests

# `api`, `streamlit_cotizador`, etc. se importan desde la raiz del repo, asi
# que no hace falta exportar PYTHONPATH a mano para correr las pruebas.
pythonpath = .

norecursedirs =
    HOLTMONT-PYTHON-main
    venv
    node_modules
    verification
    .git
    __pycache__

# Las pruebas del backend GAS son de Node y se corren aparte:
#   node tests/gas/run_tests.js
